name: Python application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements/*.txt

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    - name: Lint with flake8
      run: |
        # stop the build on syntax errors or undefined names
        flake8 src tests app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # style issues are reported but do not fail the build
        flake8 src tests app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Compile python files
      run: python -m compileall -q src/ tests/ app.py

    - name: Run tests
      run: python -m pytest -q

    - name: Migrations apply to an empty database
      env:
        DATABASE_URL: sqlite:///ci_migrations.db
      run: alembic upgrade head

    - name: Dependency audit (reports known vulnerabilities; does not block the build)
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit -r requirements/api.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build the image (not pushed)
      run: docker build -t tweet-sentiment:ci .
