
services:
  db:
    image: postgres:15-alpine
    container_name: tweet_sentiment_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or in a .env file next to docker-compose.yml}
      POSTGRES_DB: tweet_sentiment
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tweet_sentiment"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tweet_sentiment_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      # overrides DATABASE_URL from .env.docker so the password is defined in one place
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/tweet_sentiment
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: tweet_sentiment_worker
    restart: always
    command: ["python", "-m", "tweet_sentiment_classifier.worker.main"]
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/tweet_sentiment
    depends_on:
      web:
        condition: service_healthy  # the web container applies the migrations first

  # Opt-in: docker compose --profile monitoring up. Scrapes web:8000/metrics (see monitoring/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - web

volumes:
  postgres_data:
