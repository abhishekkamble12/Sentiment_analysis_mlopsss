# Models trained, exported and evaluated by main.py (TF-IDF features, see models/factory.py).
# XGBoost is supported but needs requirements/train.txt; the transformer is trained separately (models/finetune.py).
models_to_train:
  - LogisticRegression
  - LinearSVC
  - MultinomialNB
  - RidgeClassifier

# Shared global configurations
random_state: 42
max_features: 15000

# Model-specific hyperparameters.
# Tuned on the VALIDATION split (test split not read); see artifacts/evaluation/tuning.json.
LogisticRegression:
  C: 4.0              # grid 1, 4, 16, 64; converged at max_iter 1000
  solver: "lbfgs"
  max_iter: 1000

LinearSVC:
  C: 1.0              # grid 0.3, 1, 3, 10 (calibrated with CalibratedClassifierCV)
  loss: "squared_hinge"
  max_iter: 1000

MultinomialNB:
  alpha: 0.01         # grid 0.3 .. 0.01; still at the grid edge but gains are < 0.001 macro-F1

RidgeClassifier:
  alpha: 1.0          # grid 3, 1, 0.3

XGBoost:
  n_estimators: 80
  max_depth: 5
  learning_rate: 0.15

# Fine-tuning settings for models/finetune.py (PyTorch)
DistilBERT:
  epochs: 3
  batch_size: 32
  learning_rate: 0.00002
  max_len: 64
